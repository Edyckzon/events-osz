project_id = "osz-events"

[auth]
enable_anonymous_sign_ins = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/auth/callback", "http://localhost:5173/account?recovery=1"]
minimum_password_length = 12

[auth.email]
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[functions.notify]
verify_jwt = false
